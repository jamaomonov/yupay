[project]
name = "yupay-workspace"
version = "0.0.1"
description = "YuPay monorepo workspace root (Python apps live under apps/)."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/scheduler", "apps/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "migrations/versions",
    "**/generated/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C901",   # mccabe complexity
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "A",      # flake8-builtins
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific
]
ignore = [
    "S101",     # assert (allowed in tests)
    "PLR0913",  # too many arguments
    "TRY003",   # avoid long messages outside exception class
    "EM101",    # raw string in exception
    "EM102",    # f-string in exception
    "ISC001",   # implicit string concat (formatter handles)
    # Multilingual codebase: Russian / Uzbek strings legitimately use
    # Cyrillic letters, the U+02BB apostrophe (Uzbek), the multiplication
    # ×, dash variants, etc. ruff's ambiguous-character warnings produce
    # only false positives for us.
    "RUF001",   # ambiguous unicode in strings (Cyrillic, Uzbek ʻ)
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
    # Stylistic / complexity gates — useful as editor hints, but they
    # block CI on existing intentional code (lazy imports for optional
    # SDK loads, boolean flags in test/health helpers, multi-branch
    # checkout flow). Keep them as ``noqa``-able locally; do not gate
    # merges on them.
    "PLC0415",  # imports not at top level (Sentry, fakeredis lazy load)
    "FBT001",   # boolean positional in function def
    "FBT002",   # boolean default positional
    "C416",     # list comprehension can be list()
    "C901",     # cyclomatic complexity over threshold
    "PLR2004",  # magic value in comparison
    "PLW0603",  # global usage (module-level singletons in core/*)
    "RUF006",   # store reference to asyncio.create_task
    "RUF059",   # unpacked variable never used
    "TRY203",   # unnecessary catch + re-raise
    "S608",     # SQL injection (we use SQLAlchemy bind-params, false positives on f-strings)
    "E501",     # line too long — let black/ruff format draw the line
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use hardcoded "secrets", magic numbers, unused args (fixture
# injection), PT019 (we like underscore-prefixed yielded fixtures), lazy imports
# (to keep fixture import-time light), and i18n strings with Uzbek apostrophes (U+02BB).
"**/tests/**" = ["S", "PLR2004", "ARG", "PT019", "PLC0415", "RUF001"]
"**/migrations/**" = ["E501", "I"]
# Module-level lazy singletons are intentional in core; flagging `global` here is noise.
"**/core/db.py" = ["PLW0603"]
"**/core/redis.py" = ["PLW0603"]
"**/core/clock.py" = ["PLW0603"]
# Composition root mounts routers lazily; suppress PLC0415 there.
"**/bootstrap.py" = ["PLC0415"]
# Seed scripts carry i18n strings (Uzbek apostrophe U+02BB) and are linear-imperative
# by design — the function-complexity checks add no value here.
"**/scripts/seed_catalog.py" = ["RUF001", "C901", "PLR0912", "PLR0915"]
# Form-schema validator is one big match-on-type that doesn't benefit from being split.
"**/orders/validation.py" = ["C901", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]
# Each app has its own `tests/` package; treat them as separate roots so mypy doesn't
# trip on duplicate module names.
explicit_package_bases = true
namespace_packages = true
mypy_path = "apps/api/src:apps/worker/src:apps/scheduler/src:apps/bot/src:apps/api:apps/worker:apps/scheduler:apps/bot"
exclude = [
    "^.*/migrations/versions/.*$",
    "^.*/generated/.*$",
    "^\\.venv/.*$",
    "^apps/(worker|scheduler|bot)/tests/.*$",
]

[[tool.mypy.overrides]]
# Tests use a lot of fixture injection + monkeypatching; full strictness adds noise
# without catching real bugs.
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
# Test helpers routinely return ``r.json()[...]`` which mypy widens to
# ``Any`` because httpx ``json()`` returns ``Any``. Casting every helper
# would be five lines of busywork per file with no real correctness
# gain — the assertions immediately after pin the type.
warn_return_any = false
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
# Seed scripts are linear-imperative and use a lot of helper closures over an
# AsyncSession. Full strictness adds noise without catching real bugs.
module = ["yupay.scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
# Third-party libs that don't ship type stubs.
module = [
    "apscheduler.*",
    "boto3.*",
    "botocore.*",
    "dramatiq.*",
    "fakeredis.*",
    "respx.*",
    "testcontainers.*",
    "uuid_utils.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
# ``--import-mode=importlib`` resolves the ``tests`` namespace clash
# between the four ``apps/*/tests`` packages — pytest's legacy importer
# treats them as one shared ``tests`` package and trips over duplicate
# module names (``ModuleNotFoundError: No module named
# 'tests.test_i18n'``). It is a CLI flag so it has to live in
# ``addopts``; declaring it as ``import_mode = "importlib"`` is rejected
# by ``--strict-config`` on pytest 9.
addopts = "-ra --strict-markers --strict-config --cov-report=term-missing --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/scheduler/tests", "apps/bot/tests"]
markers = [
    "integration: tests that require testcontainers (postgres, redis)",
    "contract: tests that hit recorded supplier/provider cassettes",
    "load: load tests (not run in CI by default)",
]

[tool.coverage.run]
source = ["apps"]
# sys.monitoring tracer, line coverage only. The default ctrace core loses
# the trace after the first ``await db.execute(...)`` in a frame
# (SQLAlchemy's async engine hops through greenlets) and silently
# undercounted every service-layer function by 20-40 points;
# ``concurrency = greenlet`` did not help. branch coverage must stay off:
# on Python 3.12 it forces a fallback to the broken ctrace core — honest
# line numbers beat strict-looking-but-wrong branch numbers.
core = "sysmon"
omit = [
    "**/migrations/*",
    "**/generated/*",
    "**/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet floor — keep in sync with --cov-fail-under in ci.yml. Already above
# the AGENTS.md §8 80% target; raise this every time coverage lands above it.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
