[project]
name = "yupay-bot"
version = "0.0.1"
description = "YuPay Telegram bot (aiogram 3)"
requires-python = ">=3.12"
dependencies = [
    "yupay",
    "aiogram>=3.13",
    "structlog>=24.4",
]

[tool.uv.sources]
yupay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay_bot"]
