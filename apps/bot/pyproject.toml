[project]
name = "yupay-bot"
version = "0.0.1"
description = "YuPay Telegram bot (aiogram 3)"
requires-python = ">=3.12"
dependencies = [
    "yupay",
    "aiogram>=3.13",
    # Required by aiogram's AiohttpSession whenever a proxy is configured
    # (TELEGRAM_PROXY_URL) — it builds the connector via aiohttp_socks, which
    # covers both HTTP and SOCKS proxies. Without it the bot crashes on startup
    # in environments that route the Bot API through a proxy (e.g. RU hosting).
    "aiohttp-socks>=0.9",
    "structlog>=24.4",
]

[tool.uv.sources]
yupay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay_bot"]
