[project]
name = "yupay"
version = "0.0.1"
description = "YuPay backend — FastAPI modular monolith"
requires-python = ">=3.12"
authors = [{ name = "YuPay team" }]
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=5.2",
    "google-auth>=2.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "purgatory>=3.0",
    "structlog>=24.4",
    # Direct, not transitive-by-accident: `core/metrics.py` imports `Counter`
    # from it. It arrives with the instrumentator below either way, but code
    # that imports a package declares it.
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk[fastapi]>=2.17",
    "slowapi>=0.1.9",
    "pynacl>=1.5",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43.0",
    "email-validator>=2.2",
    "uuid-utils>=0.10",
    "orjson>=3.10",
    "python-multipart>=0.0.12",
    "aiogram>=3.13",
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
    # CommonMark parser for the Bunzy blog import (ADR-0077). Pure Python,
    # one small dependency (mdurl), and its own renderer is subclassable —
    # which is how `blog/markdown_html.py` emits only the fail-closed
    # allowlist instead of post-processing somebody else's HTML with regex.
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.8",
    "fakeredis>=2.26",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.7",
    "anyio>=4.6",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay"]
