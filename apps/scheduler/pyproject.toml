[project]
name = "yupay-scheduler"
version = "0.0.1"
description = "YuPay periodic jobs (APScheduler)"
requires-python = ">=3.12"
dependencies = [
    "yupay",
    "apscheduler>=3.10",
    "structlog>=24.4",
]

[tool.uv.sources]
yupay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay_scheduler"]
