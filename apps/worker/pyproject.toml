[project]
name = "yupay-worker"
version = "0.0.1"
description = "YuPay background workers (Dramatiq)"
requires-python = ">=3.12"
dependencies = [
    "yupay",
    "dramatiq[redis,watch]>=1.17",
    "structlog>=24.4",
]

[tool.uv.sources]
yupay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay_worker"]
