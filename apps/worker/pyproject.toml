[project]
name = "yupay-worker"
version = "0.0.1"
description = "YuPay background workers (Postgres-queue consumer)"
requires-python = ">=3.12"
dependencies = [
    "yupay",
    "asyncpg>=0.29",
    "structlog>=24.4",
]

[tool.uv.sources]
yupay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupay_worker"]
