name: yupay-prod

x-app-env: &app-env
  ENVIRONMENT: prod
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_JSON: "true"

# Telegram's IPv4 ranges are blocked on this host's egress (RU cloud):
# ``curl -4 https://api.telegram.org`` times out while ``curl -6``
# returns 302 in ~0.1s. Every container that calls the Telegram Bot API
# must therefore reach it over IPv6:
#   - ``bot`` is outbound-only (long-poll) with no internal-network deps,
#     so it uses ``network_mode: host`` to borrow the host's working IPv6.
#   - ``api`` / ``worker`` / ``scheduler`` keep the bridge (they need the
#     postgres/redis/api service-name DNS) and get IPv6 egress from the
#     ``enable_ipv6`` + ULA + NAT66 on the ``default`` network below.
# See docs/runbooks/telegram-connectivity.md.
#
# ICMP "fragmentation needed" is often filtered on cloud egress, so the
# kernel can't learn the path MTU from ICMP. tcp_mtu_probing=2 forces TCP
# MTU probing (RFC 4821) for every connection — free on healthy paths,
# recovers from black-hole MTU drops on the bad ones. Kept for the
# remaining IPv4 egress (e.g. payment providers).
x-mtu-probe: &mtu-probe
  - net.ipv4.tcp_mtu_probing=2

# Bridge containers reach Telegram only over IPv6, but their sole IPv6
# source is the ULA (fc00::/7). RFC 6724's default label table demotes a
# global-IPv6 destination against a ULA source (Rule 5, mismatched label),
# so getaddrinfo hands back the blocked IPv4 first and httpx ConnectTimeouts
# on admin alerts. Mounting this gai.conf relabels fc00::/7 to the global
# label (1) so IPv6 sorts first. See docs/runbooks/telegram-connectivity.md.
x-gai-volume: &gai-volume
  - ./infra/docker/gai.conf:/etc/gai.conf:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /opt/yupay/secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file: /opt/yupay/secrets/postgres-exporter.env
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: /opt/yupay/secrets/minio.env
    volumes:
      - minio-data:/data

  api:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: /opt/yupay/secrets/api.env
    sysctls: *mtu-probe
    volumes: *gai-volume
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz || exit 1"]
      interval: 30s

  worker:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-worker:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: /opt/yupay/secrets/api.env
    sysctls: *mtu-probe
    volumes: *gai-volume
    depends_on: [postgres, redis]

  scheduler:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-scheduler:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: /opt/yupay/secrets/api.env
    sysctls: *mtu-probe
    volumes: *gai-volume
    depends_on: [postgres, redis]

  bot:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-bot:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: /opt/yupay/secrets/api.env
    # Telegram is reachable only over IPv6 from this host (IPv4 blocked).
    # The bot is outbound-only (long-poll) with no internal-network deps,
    # so it borrows the host netns to use the host's working IPv6 directly.
    # Namespaced net.* sysctls are incompatible with host networking, so the
    # tcp_mtu_probing tweak is dropped here — the host sets its own.
    # See docs/runbooks/telegram-connectivity.md.
    network_mode: host
    depends_on: [api]

  web:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: /opt/yupay/secrets/web.env

  miniapp:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-miniapp:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: /opt/yupay/secrets/miniapp.env

  admin:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-admin:${IMAGE_TAG:-main}
    restart: unless-stopped
    # admin is a static Vite build served by nginx — no env file
    # because every config is baked into the build at CI time.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # GRAFANA_BASIC_AUTH_HASH lives in grafana.env — Caddy substitutes
    # it into the {$GRAFANA_BASIC_AUTH_HASH} placeholder on
    # grafana.yupay.uz. Other keys in the file are ignored.
    env_file: /opt/yupay/secrets/grafana.env
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, miniapp, admin]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file: /opt/yupay/secrets/grafana.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on: [loki]

  backup:
    image: alpine:3.20
    # Long-running: run_nightly.sh sleeps until BACKUP_HOUR_UTC (default 02:00)
    # and runs pg_backup.sh daily. unless-stopped keeps the schedule alive
    # across reboots. One-off runs override the command (see `make backup`).
    restart: unless-stopped
    env_file: /opt/yupay/secrets/backup.env
    volumes:
      - ./infra/backup:/scripts:ro
      - backup-tmp:/tmp/backup
    depends_on: [postgres]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'apk add --no-cache postgresql-client age rclone bash >/dev/null && exec "$@"',
        "--",
      ]
    command: ["/bin/sh", "/scripts/run_nightly.sh"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:
  backup-tmp:

# Pin the bridge MTU to 1450. Yandex Cloud's VPC has a smaller
# effective path MTU than 1500: small packets (TLS handshakes,
# getUpdates long-polls, getMe responses) survive, but larger ones
# (e.g. an HTML ``sendMessage`` POST with an inline_keyboard) get
# fragmented somewhere on the egress and never make it to
# ``api.telegram.org``. Symptom — only outgoing messages time out
# while ``get_me`` and ``getUpdates`` work fine.
# 1450 is the Yandex VPC recommended value and matches most other
# Russian cloud providers (Selectel / Timeweb / VK Cloud).
networks:
  default:
    driver: bridge
    # Telegram's IPv4 is blocked on this host; the only working route is
    # IPv6 (see the x-mtu-probe note + the runbook). Bridge containers that
    # call the Bot API (api/worker/scheduler) need IPv6 egress. Docker ≥ 27
    # has ip6tables on by default and NAT66-masquerades a ULA subnet to the
    # host's global IPv6 automatically — verify with:
    #   docker version --format '{{.Server.Version}}'
    # On older Docker set ``"ip6tables": true`` in /etc/docker/daemon.json
    # and restart the daemon, else the ULA addresses have no route out.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0de:cafe::/64
    driver_opts:
      com.docker.network.driver.mtu: "1450"
