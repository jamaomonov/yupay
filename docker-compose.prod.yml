name: yupay-prod
#
# Secrets live in ``./secrets/*.env``, next to this file and git-ignored. They
# are deliberately NOT in the image and NOT in git: the server holds the only
# copy, and its deploy key is read-only, so nothing here can be pushed back.
# ``infra/secrets-example/`` documents every key. Paths are relative so the
# stack can be checked out anywhere — it does not depend on a fixed /opt path.

x-app-env: &app-env
  ENVIRONMENT: prod
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_JSON: "true"

# Bound every container's json-file logs. Without this the driver keeps an
# unbounded log per container — weeks of logs grew to hundreds of MB each,
# helped fill the disk (which wedged Loki), and got replayed on every promtail
# restart. Promtail already ships everything to Loki, so a small local buffer
# is all we need. 10MB × 3 files ≈ 30MB/container max.
# Memory ceilings on every container. This VPS is shared with an unrelated
# production stack and has NO swap, so memory pressure goes straight to the
# kernel OOM killer — which picks its victim by size, not by owner. Without
# these, one leaking container of ours can evict the neighbour's database.
#
# They are ceilings, not reservations: each is roughly 3-4x the measured
# steady state, so the point is to stop runaway growth, not to pack the box.
# Set one too tight and the container exits 137 into a `restart: unless-stopped`
# crash loop, which for postgres means repeated crash recovery — err loose.
#
# Deliberately NO cpu quotas on api/web/worker: a hard quota caps throughput
# during exactly the spike it was provisioned for. Contention there should be
# resolved by shares, not ceilings.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# NOTE on egress: this stack previously ran on an RU cloud where Telegram's
# IPv4 ranges were blocked, which forced an IPv6-only egress path (ULA subnet
# + NAT66, a gai.conf that re-labels fc00::/7, and ``network_mode: host`` on
# the bot). The current host reaches api.telegram.org over IPv4 directly and
# has no global IPv6 at all, so those workarounds are not merely redundant —
# they break egress. They were removed; see ADR-0030 and
# docs/runbooks/telegram-connectivity.md.

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    mem_limit: 4g
    # Postgres puts parallel-query results in shared memory, and Docker's
    # default /dev/shm is 64MB. With max_parallel_workers at 8 that produces
    # "could not resize shared memory segment" once the tables are large enough
    # for the planner to choose a parallel plan — a failure that appears only
    # at the scale where it is hardest to reproduce.
    shm_size: 1gb
    restart: unless-stopped
    # The image ships stock defaults, which are sized for a laptop: 128MB of
    # shared_buffers on a box with 23GB, and a planner that still believes it
    # is talking to a spinning disk. Everything below is measured against the
    # 4g container limit above, not against the host — the two must not be
    # confused, or the OOM killer settles the argument.
    command:
      - postgres
      # 1GB of the 4GB limit. Eight times the default, and deliberately not the
      # 2GB a "25% of RAM" rule would suggest for the host: the rest of the
      # limit has to cover per-connection memory, work_mem, and maintenance.
      - "-c"
      - "shared_buffers=1GB"
      # A planner hint, not an allocation: how much data is likely to be in
      # shared_buffers *or* the host page cache. The host keeps ~17GB in
      # buff/cache, but it is shared with another stack, so 3GB is the honest
      # number rather than the flattering one.
      - "-c"
      - "effective_cache_size=3GB"
      # Doubled. It matters less than it did now that the admin lists have
      # sorting indexes (migration 0055) — before them every list sort spilled
      # to disk at 4MB. Kept modest because it is per-sort, per-connection.
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      # SSD. The default of 4 tells the planner random reads cost four times a
      # sequential one, which on this hardware is false and biases it towards
      # sequential scans — the opposite of what the new indexes are for.
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      # 19 connections are in use today, and the configured pools can reach 100
      # (api 20 + worker 2x20 + scheduler 20 + bot 20) — exactly the old
      # ceiling, with nothing left for psql or a migration. This is the headroom
      # that has to exist before a second uvicorn worker is ever considered.
      - "-c"
      - "max_connections=200"
      # A connection idle *inside a transaction* is the pool-exhaustion shape:
      # a request that opened a transaction and then went off to wait on a
      # supplier. Two minutes is far longer than any legitimate one.
      #
      # statement_timeout is deliberately NOT set. It would also apply to
      # migrations, which run as this same role, and killing a CREATE INDEX
      # halfway is a worse outcome than the runaway query it would prevent.
      # Revisit once migrations use CONCURRENTLY as a matter of course.
      - "-c"
      - "idle_in_transaction_session_timeout=120s"
      # Query-level observability. Without it, "the database got slow" is a
      # conversation with no evidence in it.
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=top"
    env_file: ./secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container shell — POSTGRES_USER/DB come
      # from the env_file at runtime, not from compose interpolation. A bare
      # ``pg_isready`` probes as OS user root and spams the server log with
      # ``FATAL: role "root" does not exist`` every interval.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    env_file: ./secrets/postgres-exporter.env
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    logging: *default-logging
    mem_limit: 768m
    restart: unless-stopped
    # requirepass: the VPS is shared with another stack and Redis holds the task
    # queue and rate-limit state, so it must not be an open door to anything that
    # gets a foothold on the docker networks. $$ defers expansion to the
    # container shell; REDIS_PASSWORD comes from the env file.
    # ROLLOUT: requires secrets/redis.env on the server AND password-carrying
    # REDIS_URL/DRAMATIQ_BROKER_URL in api.env — see
    # docs/runbooks/redis-auth-rollout.md before deploying this change.
    env_file: ./secrets/redis.env
    # --maxmemory bounds it; the eviction policy stays `noeviction` ON PURPOSE.
    # `allkeys-lru` looks like the safe default and is the dangerous one here:
    # Redis holds the Dramatiq queue, so evicting to make room would silently
    # drop fulfilment jobs for orders customers have already paid for. Refusing
    # writes is the correct failure — pair it with an alert at 70% so a human
    # intervenes before that happens. mem_limit above is deliberately higher, so
    # Redis hits its own ceiling before the OOM killer sees it.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data

  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    # Reads REDIS_PASSWORD straight from the shared redis.env.
    env_file: ./secrets/redis.env
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  # No object store here on purpose. Media (brand/product images) lives in
  # Cloudflare R2 — see ADR-0018 and modules/storage/. The admin SPA uploads
  # straight to R2 with a presigned PUT this API issues, so large images never
  # touch FastAPI and there is nothing for a local S3 to serve. A MinIO service
  # used to sit here, reachable by no code path at all: R2_* are the only storage
  # settings the code reads, and S3_* were never wired to anything.

  api:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-api:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 2g
    # Every signed-in miniapp session holds a WebSocket for its whole life, and
    # each costs two descriptors (the socket, plus its own Redis pub/sub
    # connection). The inherited default is 1024, i.e. a hard wall at roughly
    # 490 concurrent sessions — past which uvicorn stops accepting ANY
    # connection, HTTP included, and does not recover on its own.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: ./secrets/api.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # No compose-level healthcheck: the image (infra/docker/api.Dockerfile)
    # ships a python-urllib HEALTHCHECK. The old wget override here failed
    # forever — the slim image has no wget — keeping the service "unhealthy".

  worker:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-worker:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 1.5g
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: ./secrets/api.env
    depends_on: [postgres, redis]

  scheduler:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-scheduler:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: ./secrets/api.env
    depends_on: [postgres, redis]

  bot:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-bot:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: ./secrets/api.env
    depends_on: [api]

  web:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-web:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 1.5g
    # Same inherited 1024 default; Next.js holds sockets for SSR fetches and
    # keep-alives.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    environment:
      # Server Components and ISR revalidation talk to the API directly over
      # the compose network. Without this they fall back to
      # NEXT_PUBLIC_API_BASE_URL — the public hostname — so every server render
      # left the box, traversed Cloudflare and Caddy, and came back to the
      # container next door. Besides the wasted round trip, that traffic
      # arrived carrying the VPS's own egress address, which put all server
      # rendering into a single per-IP rate-limit bucket that grows with the
      # catalog. Not a secret: it is an internal hostname, so it belongs here
      # rather than in secrets/web.env (which is documented as public-only,
      # since NEXT_PUBLIC_* values are inlined into the browser bundle).
      API_INTERNAL_URL: http://api:8000
    env_file: ./secrets/web.env
    depends_on:
      api: { condition: service_started }

  miniapp:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-miniapp:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    env_file: ./secrets/miniapp.env

  admin:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/yupay-admin:${IMAGE_TAG:-main}
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    # admin is a static Vite build served by nginx — no env file
    # because every config is baked into the build at CI time.

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    # GRAFANA_BASIC_AUTH_HASH lives in grafana.env — Caddy substitutes
    # it into the {$GRAFANA_BASIC_AUTH_HASH} placeholder on
    # grafana.yupay.uz. Other keys in the file are ignored.
    env_file: ./secrets/grafana.env
    # No host ports: the shared edge proxy (infra/edge/) owns 80/443 on this
    # box because a second stack (streamers-parser) shares the VPS and only one
    # process can bind them. The edge terminates TLS and forwards here over the
    # ``edge`` network, so this Caddy is a plain HTTP host-router — see ADR-0030.
    # The alias is what the edge's Caddyfile proxies to; the bare service name
    # ``caddy`` would collide with the neighbouring stack's own Caddy on the
    # shared network.
    networks:
      default: {}
      edge:
        aliases: [yupay-caddy]
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, miniapp, admin]

  prometheus:
    image: prom/prometheus:v3.12.0
    logging: *default-logging
    mem_limit: 1g
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  node-exporter:
    image: prom/node-exporter:v1.11.1
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    # ALERT_BOT_TOKEN / ALERT_CHAT_ID are read from the same secrets the API
    # uses for its own ops messages, so the alerts land in the chat that is
    # already being watched rather than in a new one nobody has open.
    env_file: ./secrets/alertmanager.env
    volumes:
      - ./infra/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager-data:/alertmanager
    # Alertmanager does no env expansion of its own, so the template's two
    # placeholders are rendered here at start-up. The result goes to the
    # private volume, never to the bind mount, so the credentials stay out of
    # the repo and out of the image. `chat_id` is unquoted on purpose —
    # Alertmanager wants an integer there.
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|__ALERT_BOT_TOKEN__|$$ALERT_BOT_TOKEN|"
        -e "s|__ALERT_CHAT_ID__|$$ALERT_CHAT_ID|"
        /etc/alertmanager/alertmanager.tmpl.yml > /alertmanager/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/alertmanager/alertmanager.yml
        --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:13.0.2
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    env_file: ./secrets/grafana.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.7.2
    logging: *default-logging
    mem_limit: 1g
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.6.11
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Read-only: promtail only enumerates containers. A writable docker.sock
      # is host root — an RCE/supply-chain compromise of this image would
      # otherwise escalate to full host takeover.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on: [loki]

  backup:
    image: alpine:3.20
    logging: *default-logging
    mem_limit: 512m
    # Long-running: run_nightly.sh sleeps until BACKUP_HOUR_UTC (default 02:00)
    # and runs pg_backup.sh daily. unless-stopped keeps the schedule alive
    # across reboots. One-off runs override the command (see `make backup`).
    restart: unless-stopped
    env_file: ./secrets/backup.env
    volumes:
      - ./infra/backup:/scripts:ro
      - backup-tmp:/tmp/backup
    depends_on: [postgres]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'apk add --no-cache postgresql-client age rclone bash >/dev/null && exec "$@"',
        "--",
      ]
    command: ["/bin/sh", "/scripts/run_nightly.sh"]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  backup-tmp:

networks:
  # Private stack network: postgres, redis, api, worker, bot, the
  # frontends and the monitoring sidecars all talk over this and publish
  # nothing to the host.
  default:
    driver: bridge

  # Shared with the edge proxy and the co-hosted streamers-parser stack.
  # Only ``caddy`` joins it, so nothing else in this stack is reachable
  # from the neighbouring project. Created out-of-band:
  #   docker network create yupay-edge
  edge:
    external: true
    name: yupay-edge
