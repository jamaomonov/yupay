version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    ignore:
      # Python runtime is pinned by .python-version / pyproject (3.12). Major bumps
      # go through a dedicated ADR, not Dependabot.
      - dependency-name: "python"
    groups:
      python-prod:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      python-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    ignore:
      # Frameworks pinned in the stack (see AGENTS.md). Major bumps need an ADR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      ts-prod:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      ts-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "docker"]
    ignore:
      # Base images are pinned (python 3.12, node 22). Major bumps need an ADR.
      - dependency-name: "python"
      - dependency-name: "node"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
