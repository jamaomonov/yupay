name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: ["staging", "production"]
      image_tag:
        description: "Image tag (sha-..., vX.Y.Z, or main)"
        required: true
        default: "main"

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # The tag is a free-form dispatch input. Validate the shape here and
      # pass it to the remote script as an env var (never interpolate
      # ${{ }} into shell text — that is a command-injection vector).
      - name: Validate image tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG_INPUT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$'; then
            echo "::error::invalid image_tag: must match ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG_INPUT
          script: |
            set -euo pipefail
            # Everything lives in the deploy user's checkout: compose, configs,
            # and the git-ignored secrets/ it mounts by relative path. No
            # root-owned paths, so no sudo anywhere in this script.
            cd /home/ubuntu/opt/yupay
            git fetch --all --tags --prune --force
            # Land the checkout on the freshly-fetched commit. A plain
            # ``git checkout main`` switches to the LOCAL branch and does not
            # move it to origin, so the on-disk compose/Caddyfiles stayed behind
            # origin/main while only the images updated — an infra change would
            # then silently not deploy. For a branch input, hard-reset the local
            # branch to its remote ref; a sha/tag input has no origin/<x> and
            # falls through to a (detached) checkout.
            if git rev-parse -q --verify "origin/$IMAGE_TAG_INPUT" >/dev/null; then
              git checkout -B "$IMAGE_TAG_INPUT" "origin/$IMAGE_TAG_INPUT"
            else
              git checkout --force "$IMAGE_TAG_INPUT" || git checkout --force main
            fi
            export IMAGE_TAG="$IMAGE_TAG_INPUT"

            # The shared edge proxy owns :80/:443 for every stack on this box
            # (see ADR-0030). It is idempotent and must be up before the app
            # stack registers its ``yupay-caddy`` alias on the network.
            docker network inspect yupay-edge >/dev/null 2>&1 || docker network create yupay-edge
            docker compose -f infra/edge/docker-compose.yml up -d

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 5
            curl -fsS https://api.yupay.uz/healthz
            curl -fsS https://api.yupay.uz/readyz
