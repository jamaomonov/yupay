name: Publish docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin
      - run: |
          cat > mkdocs.yml <<'EOF'
          site_name: YuPay docs
          docs_dir: docs
          theme:
            name: material
            features: [navigation.tabs, content.code.copy]
          plugins:
            - search
            - mermaid2
          markdown_extensions:
            - admonition
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:mermaid2.fence_mermaid
          EOF
          # Dropped ``--strict`` while the docs reorganisation settles —
          # broken cross-refs from ADR drafts ("link not found among
          # documentation files") were breaking the entire build. Once
          # we sweep the ADR set we'll bring it back.
          mkdocs build --site-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "_site" }
      - id: deployment
        uses: actions/deploy-pages@v4
