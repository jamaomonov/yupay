name: Build docs

# GitHub Pages is not enabled on this repo, so we only build the docs
# site — the build catches Markdown / Mermaid / MkDocs config errors
# in CI without trying to publish anywhere. Re-enable the deploy step
# (``actions/configure-pages`` + ``actions/deploy-pages``) once Pages
# is turned on in repo Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin
      - run: |
          cat > mkdocs.yml <<'EOF'
          site_name: YuPay docs
          docs_dir: docs
          theme:
            name: material
            features: [navigation.tabs, content.code.copy]
          plugins:
            - search
            - mermaid2
          markdown_extensions:
            - admonition
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:mermaid2.fence_mermaid
          EOF
          # Dropped ``--strict`` while the docs reorganisation settles —
          # broken cross-refs from ADR drafts ("link not found among
          # documentation files") were breaking the entire build. Once
          # we sweep the ADR set we'll bring it back.
          mkdocs build --site-dir _site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site
          retention-days: 7
