name: CodeQL

# CodeQL code-scanning requires GitHub Advanced Security, which is
# free for public repos but paid for private ones. While the repo
# stays private on the free plan, the workflow exits with
# "Code scanning is not enabled for this repository" — keep it
# wired up but only firable manually, so push/PR statuses stay
# green. Re-enable the cron / push triggers when the repo turns
# public or GHAS is purchased.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
