name: yupay-dev

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yupay_app}:${POSTGRES_PASSWORD:-yupay_app}@postgres:5432/${POSTGRES_DB:-yupay}
  REDIS_URL: redis://redis:6379/0
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  # Separate admin-panel Login Widget bot; empty => falls back to TELEGRAM_BOT_TOKEN.
  ADMIN_TELEGRAM_BOT_TOKEN: ${ADMIN_TELEGRAM_BOT_TOKEN:-}
  # Outbound proxy for api.telegram.org (bot + notifications). Empty => direct.
  TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
  JWT_EMAIL_TOKEN_TTL_SECONDS: ${JWT_EMAIL_TOKEN_TTL_SECONDS:-1800}
  AUTH_EMAIL_PEPPER: ${AUTH_EMAIL_PEPPER:-}
  AUTH_IP_GUARD_MAX: ${AUTH_IP_GUARD_MAX:-10}
  AUTH_IP_GUARD_WINDOW_SECONDS: ${AUTH_IP_GUARD_WINDOW_SECONDS:-60}
  WEB_BASE_URL: ${WEB_BASE_URL:-}
  # Email (Resend) — verify/reset + guest order emails. Empty RESEND_API_KEY
  # disables sends (send_email raises EmailSendError, caught best-effort).
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-noreply@yupay.uz}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-YuPay}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ADMIN_DEV_LOGIN_ENABLED: ${ADMIN_DEV_LOGIN_ENABLED:-false}
  ADMIN_DEV_LOGIN: ${ADMIN_DEV_LOGIN:-admin}
  ADMIN_DEV_PASSWORD: ${ADMIN_DEV_PASSWORD:-admin}
  CORS_ALLOW_ORIGINS: '${CORS_ALLOW_ORIGINS:-["*"]}'
  FX_EXCHANGERATE_API_KEY: ${FX_EXCHANGERATE_API_KEY:-}
  FX_RATES_API_KEY: ${FX_RATES_API_KEY:-}
  # G2Bulk supplier — set in .env (or /opt/yupay/secrets/api.env in prod).
  # Empty G2B_API_KEY leaves the adapter as ``available=false``.
  G2B_API_KEY: ${G2B_API_KEY:-}
  G2B_BASE_URL: ${G2B_BASE_URL:-https://api.g2bulk.com/v1}
  G2B_WEBHOOK_SECRET: ${G2B_WEBHOOK_SECRET:-}
  G2B_CALLBACK_URL: ${G2B_CALLBACK_URL:-}
  G2B_REQUEST_TIMEOUT_SECONDS: ${G2B_REQUEST_TIMEOUT_SECONDS:-20}
  # G-Engine supplier (Standoff 2, Telegram Stars/Premium) — set in .env / prod
  # secrets. Empty GENGINE_API_KEY leaves the adapter as ``available=false``.
  #
  # This block was missing while the settings and the adapter both existed, so
  # the key sat in .env and never reached the container: the Standoff 2 and
  # Telegram imports in scripts/seed/ failed on a fresh dev machine with "is
  # not set", which reads as a missing credential rather than a missing wire.
  GENGINE_API_KEY: ${GENGINE_API_KEY:-}
  GENGINE_BASE_URL: ${GENGINE_BASE_URL:-https://api.g-engine.net/v2.1}
  # Steam gifts ship dark: the section, checkout and admin margin knob all
  # sit behind this flag (see docs/runbooks/steam-gifts.md).
  STEAM_GIFTS_ENABLED: ${STEAM_GIFTS_ENABLED:-false}
  STEAM_GIFTS_MARGIN_PERCENT: ${STEAM_GIFTS_MARGIN_PERCENT:-10}
  STEAM_GIFTS_REGION_DEFAULT: ${STEAM_GIFTS_REGION_DEFAULT:-CIS}
  STEAM_GIFTS_REGIONS: ${STEAM_GIFTS_REGIONS:-CIS,RU,KZ,UA}
  GENGINE_REQUEST_TIMEOUT_SECONDS: ${GENGINE_REQUEST_TIMEOUT_SECONDS:-20}
  # Waxpeer supplier (Steam wallet top-ups) — set in .env / prod secrets.
  # Empty WAXPEER_API_KEY leaves the adapter as ``available=false``.
  WAXPEER_API_KEY: ${WAXPEER_API_KEY:-}
  WAXPEER_BASE_URL: ${WAXPEER_BASE_URL:-https://api.waxpeer.com/v1}
  WAXPEER_REQUEST_TIMEOUT_SECONDS: ${WAXPEER_REQUEST_TIMEOUT_SECONDS:-20}
  WAXPEER_FEE_RATE: ${WAXPEER_FEE_RATE:-0}
  # Octo card acquirer — set in .env (or /opt/yupay/secrets/api.env in prod).
  # Empty OCTO_SHOP_ID/OCTO_SECRET leaves the gateway ``available=false`` and the
  # miniapp "Карта" method stays disabled. BASE_URL must be publicly reachable
  # (a tunnel in dev) for Octo's webhook to land on /api/v1/webhooks/payments/octo.
  BASE_URL: ${BASE_URL:-http://localhost:8000}
  OCTO_SHOP_ID: ${OCTO_SHOP_ID:-}
  OCTO_SECRET: ${OCTO_SECRET:-}
  OCTO_SIGNATURE_KEY: ${OCTO_SIGNATURE_KEY:-}
  OCTO_BASE_URL: ${OCTO_BASE_URL:-https://secure.octo.uz}
  OCTO_TEST_MODE: ${OCTO_TEST_MODE:-false}
  OCTO_REQUEST_TIMEOUT_SECONDS: ${OCTO_REQUEST_TIMEOUT_SECONDS:-20}
  # Payme (Paycom) Merchant API — set in .env (or /opt/yupay/secrets/api.env in
  # prod). Empty PAYME_MERCHANT_ID leaves the gateway ``available=false``.
  # PAYME_TEST_KEY (sandbox, checkout.test.paycom.uz) and PAYME_KEY (prod,
  # checkout.paycom.uz) are mutually exclusive per environment — the endpoint
  # accepts either.
  PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
  PAYME_KEY: ${PAYME_KEY:-}
  PAYME_TEST_KEY: ${PAYME_TEST_KEY:-}
  PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
  PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
  # Uzum (Merchant API) — set in .env (or /opt/yupay/secrets/api.env in prod).
  # Empty UZUM_SERVICE_ID leaves the gateway ``available=false``.
  UZUM_SERVICE_ID: ${UZUM_SERVICE_ID:-}
  UZUM_LOGIN: ${UZUM_LOGIN:-}
  UZUM_PASSWORD: ${UZUM_PASSWORD:-}
  UZUM_TEST_LOGIN: ${UZUM_TEST_LOGIN:-}
  UZUM_TEST_PASSWORD: ${UZUM_TEST_PASSWORD:-}
  UZUM_OPEN_SERVICE_URL: ${UZUM_OPEN_SERVICE_URL:-https://www.uzumbank.uz/open-service}
  # Click (Shop API) — set in .env (or /opt/yupay/secrets/api.env in prod).
  # Empty CLICK_MERCHANT_ID leaves the gateway ``available=false``.
  CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
  CLICK_SERVICE_ID_WEB: ${CLICK_SERVICE_ID_WEB:-}
  CLICK_SERVICE_ID_BOT: ${CLICK_SERVICE_ID_BOT:-}
  CLICK_SECRET_KEY_WEB: ${CLICK_SECRET_KEY_WEB:-}
  CLICK_SECRET_KEY_BOT: ${CLICK_SECRET_KEY_BOT:-}
  CLICK_MERCHANT_USER_ID_WEB: ${CLICK_MERCHANT_USER_ID_WEB:-}
  CLICK_MERCHANT_USER_ID_BOT: ${CLICK_MERCHANT_USER_ID_BOT:-}
  CLICK_PAY_URL: ${CLICK_PAY_URL:-https://my.click.uz/services/pay}
  # Admin alert bot (separate from the customer-facing bot). Empty values
  # no-op the alerts module — useful in dev before the bot is provisioned.
  TG_ALERT_BOT_TOKEN: ${TG_ALERT_BOT_TOKEN:-}
  TG_ALERT_CHAT_ID: ${TG_ALERT_CHAT_ID:-}
  PRICE_ALERT_THRESHOLD_PCT: ${PRICE_ALERT_THRESHOLD_PCT:-5}
  PRICE_REFRESH_INTERVAL_MINUTES: ${PRICE_REFRESH_INTERVAL_MINUTES:-60}
  # USD-equivalent threshold for the proactive "supplier wallet running
  # out" warning the scheduler dispatches every tick. 0 disables it.
  SUPPLIER_LOW_BALANCE_THRESHOLD: ${SUPPLIER_LOW_BALANCE_THRESHOLD:-50}
  # --- media storage (Cloudflare R2, S3-compatible) ---
  # Brand/product/SKU images are presigned for direct browser upload. Without
  # these the admin "upload image" call 500s (R2 credentials not configured).
  # Prod loads the same keys via env_file (/opt/yupay/secrets/api.env); dev
  # reads them from .env. Empty R2_ACCOUNT_ID/R2_ACCESS_KEY_ID disables uploads.
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_MEDIA: ${R2_BUCKET_MEDIA:-yupay-media}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://cdn.yupay.uz}
  R2_PRESIGN_TTL_SECONDS: ${R2_PRESIGN_TTL_SECONDS:-300}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yupay_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yupay_app}
      POSTGRES_DB: ${POSTGRES_DB:-yupay}
    ports:
      # Bind to loopback only — a dev Postgres with default creds must not be
      # reachable from the LAN. Use an SSH tunnel for remote access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yupay_app} -d ${POSTGRES_DB:-yupay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yupay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yupay-dev-secret-change-me}
    ports:
      - "127.0.0.1:${MINIO_PORT_API:-9000}:9000"
      - "127.0.0.1:${MINIO_PORT_CONSOLE:-9001}:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/api:/app/apps/api
    command: ["uvicorn", "yupay.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps:/app/apps

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/scheduler.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps:/app/apps

  bot:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_started }
    volumes:
      - ./apps:/app/apps

  web:
    # Dev image: `next dev` with HMR over the bind-mounted apps/web + packages,
    # so source edits hot-reload without rebuilding. The production build
    # (next build/start) lives in web.Dockerfile and is consumed by
    # docker-compose.prod.yml via the GHCR tag.
    build:
      context: .
      dockerfile: infra/docker/web.dev.Dockerfile
    restart: unless-stopped
    environment:
      # next dev reads NEXT_PUBLIC_* from the env at runtime (no static build),
      # so these take effect immediately. Server Components fetch the catalog
      # over the docker network (api:8000); the browser hits localhost:8000.
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      NEXT_PUBLIC_TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      # Poll the bind-mounted FS so Next's watcher sees edits on macOS/Docker.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      # Live source — edits hot-reload through Next's Fast Refresh.
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Anonymous volumes mask the bind-mounts so the image's node_modules
      # (pnpm install) survive; without these `next dev` crashes on missing deps.
      - /app/node_modules
      - /app/apps/web/node_modules

  partners:
    # Dev image: `next dev` with HMR over the bind-mounted apps/partners +
    # packages. The production build lives in partners.Dockerfile.
    build:
      context: .
      dockerfile: infra/docker/partners.dev.Dockerfile
    restart: unless-stopped
    environment:
      # The landing prerenders without touching the API, and the panel is
      # entirely client-side, so there is no API_INTERNAL_URL here — nothing
      # renders on the server that needs data.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3000
      # Poll the bind-mounted FS so Next's watcher sees edits on macOS/Docker.
      WATCHPACK_POLLING: "true"
    ports:
      - "3003:3003"
    depends_on:
      - api
    volumes:
      - ./apps/partners:/app/apps/partners
      - ./packages:/app/packages
      # Anonymous volumes mask the bind-mounts so the image's node_modules
      # survive; without these `next dev` crashes on missing deps.
      - /app/node_modules
      - /app/apps/partners/node_modules

  miniapp:
    # Dev image: runs `vite dev` with HMR. Source is bind-mounted below so
    # edits land in the browser within ~200ms (polling-based watcher). The
    # production build (nginx + static dist) lives in miniapp.Dockerfile and
    # is consumed by docker-compose.prod.yml via the GHCR image.
    build:
      context: .
      dockerfile: infra/docker/miniapp.dev.Dockerfile
    restart: unless-stopped
    environment:
      # Same-origin API calls — the SPA hits `/api/...` and Vite's proxy
      # forwards to the api container (see apps/miniapp/vite.config.ts).
      # Avoids HTTPS-to-HTTP mixed-content blocks when accessing through
      # ngrok / Telegram.
      VITE_API_BASE_URL: ""
      VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      VITE_TELEGRAM_SUPPORT_USERNAME: ${TELEGRAM_SUPPORT_USERNAME:-}
      VITE_COMPANY_NAME: ${COMPANY_NAME:-}
      VITE_COMPANY_REGISTRATION: ${COMPANY_REGISTRATION:-}
      VITE_COMPANY_SINCE: ${COMPANY_SINCE:-}
      # HMR through a public tunnel (ngrok / cloudflared). Set MINIAPP_HMR_HOST
      # to the public hostname (e.g. abc123.ngrok-free.app) — Vite will dial
      # `wss://<host>:443` instead of `ws://localhost:5173`, which is the only
      # way HMR survives reverse-proxying. Leave empty for plain localhost.
      VITE_HMR_HOST: ${MINIAPP_HMR_HOST:-}
      VITE_HMR_PROTOCOL: ${MINIAPP_HMR_PROTOCOL:-wss}
      VITE_HMR_CLIENT_PORT: ${MINIAPP_HMR_CLIENT_PORT:-443}
      DOCKER_CONTAINER: "1"
    ports:
      # External 3001 → Vite dev server on 5173 (set in vite.config.ts).
      - "3001:5173"
    depends_on:
      - api
    volumes:
      # Live source — edits hot-reload through Vite's HMR.
      - ./apps/miniapp:/app/apps/miniapp
      - ./packages:/app/packages
      # Anonymous volumes mask the bind-mounts above so node_modules baked
      # into the image survive. Without these, pnpm-install layers would be
      # invisible at runtime and `pnpm dev` would crash with missing deps.
      - /app/node_modules
      - /app/apps/miniapp/node_modules

  admin:
    # Dev image: ``vite dev`` with HMR + bind-mounted source. Production
    # build (nginx + static dist) is in ``admin.Dockerfile`` and consumed by
    # docker-compose.prod.yml via the GHCR tag.
    build:
      context: .
      dockerfile: infra/docker/admin.dev.Dockerfile
    restart: unless-stopped
    environment:
      # Same-origin API calls — the SPA hits `/api/...` and Vite's proxy
      # forwards to the api container (see apps/admin/vite.config.ts).
      VITE_API_BASE_URL: ""
      VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # HMR through a public proxy (Caddy / ngrok). Same convention as
      # miniapp — leave blank for plain ``localhost:3002`` browsing.
      VITE_HMR_HOST: ${ADMIN_HMR_HOST:-}
      VITE_HMR_PROTOCOL: ${ADMIN_HMR_PROTOCOL:-wss}
      VITE_HMR_CLIENT_PORT: ${ADMIN_HMR_CLIENT_PORT:-443}
      DOCKER_CONTAINER: "1"
    ports:
      # External 3002 → Vite dev server on 5173 (set in vite.config.ts).
      - "3002:5173"
    depends_on:
      - api
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/admin/node_modules

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
      - miniapp

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
