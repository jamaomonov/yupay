# getaddrinfo(3) source/destination address selection — RFC 6724.
#
# WHY THIS FILE EXISTS
# --------------------
# This host's egress can reach api.telegram.org ONLY over IPv6 (the IPv4
# range is blocked — see docs/runbooks/telegram-connectivity.md). Bridge
# containers (api / worker / scheduler) get IPv6 via Docker's enable_ipv6 +
# a ULA subnet (fd00:c0de:cafe::/64) that NAT66 masquerades to the host's
# global IPv6.
#
# The problem: the container's only IPv6 SOURCE address is that ULA
# (fc00::/7). Under RFC 6724's *default* label table the ULA carries label 6
# while a GLOBAL IPv6 destination (e.g. Telegram, ::/0) carries label 1.
# Destination-selection Rule 5 ("prefer matching label") therefore DEMOTES
# the global-IPv6 destination, and getaddrinfo returns the (blocked) IPv4
# address first. A sequential connector (httpx/httpcore's anyio backend)
# then dials dead IPv4 and ConnectTimeouts at 5s — admin Telegram alerts
# silently fail. (The bot is unaffected: it's on host networking with a
# global IPv6 source, and aiohttp does happy-eyeballs anyway.)
#
# THE FIX: give the ULA (fc00::/7) the SAME label as global IPv6 (1). Now
# Rule 5 matches for global destinations, IPv6 sorts ahead of IPv4, and the
# working path is tried first. Internal ULA→ULA traffic (postgres/redis over
# the bridge) is unchanged — it was already IPv6-first and healthy.
#
# glibc replaces its built-in tables wholesale once ANY label/precedence
# line is present, so the full RFC 6724 default table is reproduced below;
# the ONLY deviation from the default is the fc00::/7 label (6 -> 1).
#
# Payment providers (UZ/RU acquirers) are IPv4-only (no AAAA), so this
# changes nothing for them — they have no IPv6 destination to reorder.
# Rollback: drop the /etc/gai.conf mount from api/worker/scheduler and
# recreate the containers; behaviour reverts to the glibc default.

# label  <prefix>        <label>
label  ::1/128         0
label  ::/0            1
label  2002::/16       2
label  ::/96           3
label  ::ffff:0:0/96   4
label  fec0::/10       5
label  fc00::/7        1
label  2001::/32       7
label  3ffe::/16      12

# precedence  <prefix>   <precedence>   (RFC 6724 default — unchanged)
precedence  ::1/128        50
precedence  ::/0           40
precedence  ::ffff:0:0/96  35
precedence  2002::/16      30
precedence  2001::/32       5
precedence  fc00::/7        3
precedence  ::/96           1
precedence  fec0::/10       1
precedence  3ffe::/16       1
