server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + webhook traffic to the FastAPI container so the SPA can call
  # the backend on the same origin. Important when the miniapp is served over
  # HTTPS (ngrok / Telegram) and ``localhost:8000`` would be a mixed-content
  # block in the browser.
  location ~ ^/(api|webhooks)/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # SPA fallback — wouter handles client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Telegram Mini App should not be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Long-lived caching for hashed assets, fresh for index.html.
  location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
