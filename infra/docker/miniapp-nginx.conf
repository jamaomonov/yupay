server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No API proxy. The production build calls https://api.yupay.uz directly
  # (VITE_API_BASE_URL in build.yml). A same-origin proxy used to forward
  # /api and /webhooks to FastAPI from app.yupay.uz, which skipped the edge
  # Caddy's per-route allowlists (Payme, Paynet) and its access-log header
  # redaction. Seven days of logs before removal showed only `.env` scanners
  # using it. A 404 rather than the SPA's index.html, so a mistaken call
  # fails loudly.
  location ~ ^/(api|webhooks)/ {
    return 404;
  }

  # SPA fallback — wouter handles client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Telegram Mini App should not be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Long-lived caching for hashed assets, fresh for index.html.
  location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
