server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — wouter handles client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API requests are routed to the backend by the upstream reverse proxy (Caddy in prod).
  # The container itself does not proxy /api.

  # Telegram Mini App should not be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Long-lived caching for hashed assets, fresh for index.html.
  location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
