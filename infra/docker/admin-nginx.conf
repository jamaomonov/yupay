server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — React Router handles client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API requests are routed to the backend by the upstream reverse proxy (Caddy in prod,
  # Vite dev server in dev). The container itself does not proxy /api.

  # Don't index the admin panel.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Aggressive caching for hashed assets, none for index.html.
  location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
