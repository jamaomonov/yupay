groups:
  - name: api
    rules:
      # Saturation first. With a single uvicorn process the event loop is one
      # core, so CPU is the signal that leads every symptom by minutes —
      # latency and errors are what it looks like once it is already too late.
      # If --workers is ever set, divide the threshold by the worker count.
      - alert: ApiSaturated
        expr: rate(process_cpu_seconds_total{job="api"}[5m]) > 0.85
        for: 3m
        labels: { severity: page }
        annotations:
          summary: "API process is using >85% of a core"
          description: >
            One uvicorn process means one event loop on one core. Past this the
            queue grows and everything behind it slows together.
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/traffic-surge.md"

      # A hard wall, not a slowdown: at the limit uvicorn stops accepting every
      # connection, HTTP included, and does not recover on its own. Each
      # signed-in miniapp session holds a WebSocket plus its own Redis pub/sub
      # connection for its whole life, so this climbs with concurrent sessions.
      - alert: ApiFileDescriptorsHigh
        expr: process_open_fds{job="api"} / process_max_fds{job="api"} > 0.7
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "API has used >70% of its file descriptors"
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/traffic-surge.md"

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "API is not being scraped"

      # 2%, not 5%. Customers feel one request in fifty; five in a hundred is
      # an outage that has been running for a while.
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="api",status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.02
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "API 5xx rate > 2%"
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/incident-template.md"

      # Only meaningful since the histogram gained buckets past 1s. It used to
      # be dead code: the buckets were (0.1, 0.5, 1, +Inf), so the quantile
      # could never exceed 1.0 and this threshold of 1.5 was unreachable.
      - alert: ApiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="api"}[5m])) by (le)
          ) > 1.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "API p95 latency > 1.5s"

      # The pool is 20 connections per process and it is shared by every
      # request; a supplier call holds one for its whole round trip. Exhaustion
      # surfaces as 500s on every surface at once, which is hard to read as a
      # connection problem unless something says so.
      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Postgres is above 80% of max_connections"
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/traffic-surge.md"

      # Redis no longer holds a work queue -- the fulfilment saga moved to a
      # Postgres-native queue (ADR-0064). What lives here now (ip_guard /
      # rate-limit counters, realtime pub/sub, assorted caches) still wants
      # `noeviction`: silently evicting live guard state would just as
      # silently weaken it, so refusing writes is still the correct failure
      # and still needs a human before it happens, not after.
      - alert: RedisMemoryHigh
        # Guarded on maxmemory being set at all. Unset it reports 0, and
        # `used / 0` is +Inf — so without the guard this rule fires
        # continuously on any stack that has not configured a ceiling, which
        # is a false alarm about the one thing it is supposed to detect.
        expr: |
          redis_memory_max_bytes > 0
            and redis_memory_used_bytes / redis_memory_max_bytes > 0.7
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Redis is above 70% of maxmemory"
          description: >
            Policy is noeviction: at 100% Redis refuses writes. Check for a
            worker backlog before raising the ceiling.
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/traffic-surge.md"

      - alert: RedisCeilingUnset
        # The companion to the rule above: a Redis with no ceiling on a host
        # with no swap grows until the OOM killer intervenes, and on this
        # shared box that may be the neighbour stack's database rather than us.
        expr: redis_memory_max_bytes == 0
        for: 30m
        labels: { severity: warn }
        annotations:
          summary: "Redis has no maxmemory configured"
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/traffic-surge.md"

      # ---- Steam Web API quota (one key, two consumers) ----
      #
      # `POST /gifts/steam-profile` is unauthenticated and costs one or two
      # keyed Steam calls per DISTINCT link (the Redis verdict cache absorbs
      # repeats, so distinct links are the expensive shape). The key it spends
      # has a 100k/day ceiling and Steam **sign-in shares it**, which is why
      # both rules below sum across the `consumer` label rather than
      # filtering: the ceiling applies to the sum, not to either half.
      #
      # Exhaustion is not an outage — checks answer `unavailable` (non-blocking,
      # the buyer can still pay) and sign-ins go nameless — so both are `warn`.
      # The point is to be able to explain a burn while there is still budget
      # left, which is exactly what nobody could do before these counters.
      - alert: SteamWebApiBurnRateHigh
        # Projected, not cumulative. `increase(...[24h]) > 100000` can only
        # report a key that is already spent; extrapolating the current rate
        # over a day fires with hours of budget still in hand.
        expr: sum(rate(yupay_steam_web_api_calls_total[30m])) * 86400 > 50000
        for: 30m
        labels: { severity: warn }
        annotations:
          summary: "Steam Web API calls on pace for >50% of the 100k/day key"
          description: >
            Split by `consumer` (gifts_profile / auth_signin) and check the
            recipient check's cache hit rate before touching any limit — a
            collapsing hit rate means distinct links, not more customers.
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/steam-web-api-quota.md"

      - alert: SteamProfileChecksUnavailable
        # Guarded twice: `clamp_min` keeps the ratio finite when the metric is
        # idle (the RedisMemoryHigh lesson — an unguarded denominator makes a
        # rule fire forever about the thing it is supposed to detect), and the
        # volume floor (~36 checks/h) stops a single lonely failure at 03:00
        # reading as a 100% failure rate.
        expr: |
          sum(rate(yupay_gifts_steam_profile_checks_total{verdict="unavailable"}[15m]))
            / clamp_min(sum(rate(yupay_gifts_steam_profile_checks_total[15m])), 0.001) > 0.5
            and sum(rate(yupay_gifts_steam_profile_checks_total[15m])) > 0.01
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Over half of Steam recipient checks answer `unavailable`"
          description: >
            Steam trouble, an exhausted key, or an unset STEAM_API_KEY. Buyers
            can still pay — `unavailable` is non-blocking — but they are paying
            without having seen who the gift goes to, which is the mistyped-link
            refund this check exists to prevent.
          runbook: "https://github.com/yupay/yupay/blob/main/docs/runbooks/steam-web-api-quota.md"

# NOTE: there is no queue-depth alert. The fulfilment queue is now
# `fulfillment_tasks` in Postgres (ADR-0064), not a Redis list -- the rule
# that used to sit here watched `redis_list_length{key=~"dramatiq:.*"}`, a
# metric nothing ever emitted (the redis-exporter only reports keys named in
# REDIS_EXPORTER_CHECK_KEYS, and Dramatiq's broker did not store queues as
# plain lists anyway), so no configuration could have made it fire.
#
# Queue depth is checked manually today -- see the SQL in
# docs/runbooks/fulfillment-queue.md. An automated alert on
# `fulfillment_tasks` pending-row age/count is a real follow-up candidate,
# not built yet: it needs either a metric exported from api/worker or a
# Postgres-side exporter query, neither of which exists today. No alert rule
# is added in this change.
