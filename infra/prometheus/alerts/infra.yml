groups:
  - name: infra
    rules:
      - alert: DiskSpaceLow
        # 20%, not 10%. This box has a documented history of a disk fill
        # wedging Loki, and it is shared with another production stack — by the
        # time 10% is left there is no room to manoeuvre.
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.20
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Root filesystem < 10% free"

      - alert: HostHighMemory
        # 20%, not 10%: the host has NO swap, so there is no grace period
        # between pressure and the OOM killer — which picks its victim by size
        # rather than by owner, and may take the neighbour stack's database.
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.20
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Host memory available < 10%"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Postgres exporter not scrapeable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Redis exporter not scrapeable"

      # The money path's background half. Nothing watched it: a stopped or
      # crash-looping worker left paid orders undelivered, and the stuck-order
      # alert runs in the scheduler, which shared the blind spot. cAdvisor
      # stops reporting a container that is not running, hence `absent`.
      # It cannot see a worker that runs but is wedged — that needs a
      # heartbeat or a queue-age metric, which do not exist yet.
      - alert: FulfilmentWorkerDown
        expr: absent(container_last_seen{name=~"yupay-prod-worker-.+"})
        for: 3m
        labels: { severity: page }
        annotations:
          summary: "Fulfilment worker container is not running"
          description: >
            Paid orders are not being delivered. `docker compose ps worker`
            and its logs; restart with the deployed IMAGE_TAG.

      - alert: SchedulerDown
        expr: absent(container_last_seen{name=~"yupay-prod-scheduler-.+"})
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Scheduler container is not running"
          description: >
            Expiry, polling of in-flight supplier orders, the stuck-order
            alert and auto-refunds have all stopped.

      - alert: BackgroundServiceRestarting
        expr: changes(container_start_time_seconds{name=~"yupay-prod-(worker|scheduler|api)-.+"}[15m]) > 2
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.name }} restarted more than twice in 15 minutes"
