groups:
  - name: infra
    rules:
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Root filesystem < 10% free"

      - alert: HostHighMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Host memory available < 10%"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Postgres exporter not scrapeable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Redis exporter not scrapeable"
