global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: yupay
    env: prod

# Without this block every rule below evaluates into a UI nobody watches.
# `/api/v1/alertmanagers` returned an empty list until it was added, which is
# the failure mode where a dashboard full of green rules reads as coverage.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
